name: My First CI

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from GitHub Actions"

      - name: Check HTML file
        run: test -f index.html

      - name: Check page content
        run: grep -q "Hello Azure CI/CD" index.html

      - name: Create website package
        run: zip website.zip index.html
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: website.zip